spring.application.name=ms-bodega-ubicacion
server.port=8085

# Base de datos
spring.datasource.url=jdbc:mysql://localhost:3308/ms_bodega_ubicacion?useSSL=false&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate (Limpiado de propiedades innecesarias)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Eureka Client
eureka.client.service-url.default-zone=http://localhost:8761/eureka/

# Compatibilidad (Evita el error de versión de Spring Cloud/Boot)
spring.cloud.compatibility-verifier.enabled=false
# Nombre y Puerto
spring.application.name=ms-ventas-transacciones
server.port=8087

# Base de datos (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3308/ms_ventas_transacciones?useSSL=false&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate (Formatos profesionales)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Eureka Client (Registro en el servidor)
eureka.client.service-url.default-zone=http://localhost:8761/eureka/
# Esta línea es clave: obliga a registrarse por IP y no por nombre de host local
eureka.instance.prefer-ip-address=true

# Actuator (Monitoreo de salud del microservicio)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Desactivar verificación de compatibilidad (según tu configuración actual)
spring.cloud.compatibility-verifier.enabled=false
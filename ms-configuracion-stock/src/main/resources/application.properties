spring.application.name=ms-configuracion-stock
server.port=8083

# Base de datos
spring.datasource.url=jdbc:mysql://localhost:3308/ms-configuracion-stock?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka Client
eureka.client.service-url.default-zone=http://localhost:8761/eureka/

# Compatibilidad (Evita el error de versión de Spring Cloud/Boot)
spring.cloud.compatibility-verifier.enabled=false
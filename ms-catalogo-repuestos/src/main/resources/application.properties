spring.application.name=ms-catalogo-repuestos

# ==========================================
# AREA 1: CONFIGURACIÓN BÁSICA DEL SERVICIO (Spring Boot)
# ==========================================
server.port=8081
#CONEXION EN EL ECOSISTEMA(!OBLIGATORIO PARA EUREKA)
spring.application.name= ms-catalogo-repuestos

# ==========================================
# AREA 2: CONEXIÓN Y PERSISTENCIA (JPA / Hibernate) -> ¡Lo que ya tienes OK!
# ==========================================
#CONEXION A LA BASE DE DATOS
spring.datasource.url=jdbc:mysql://localhost:3308/ms-catalogo_repuestos?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


#JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.cloud.compatibility-verifier.enabled=false
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

